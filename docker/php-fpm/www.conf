; CallTrack AI - PHP-FPM www pool configuration
; Overrides the default www.conf distributed with the php-fpm package.
; This config switches from TCP 9000 to a unix socket so nginx and
; php-fpm communicate via socket (faster, no port conflicts with host).

[www]

; Unix user/group of processes — must match nginx worker user
user  = www-data
group = www-data

; Use unix socket — matches fastcgi_pass in docker/nginx/default.conf
listen = /var/run/php/php-fpm.sock

; Socket permissions — allows nginx (www-data) to connect
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Process manager: dynamic scales between pm.min_spare_servers and pm.max_spare_servers
pm                   = dynamic
pm.max_children      = 50
pm.start_servers     = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests      = 500

; Log to stderr so Supervisor captures output
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors]  = on

; Ensure SCRIPT_FILENAME is correctly sent from nginx
security.limit_extensions = .php
